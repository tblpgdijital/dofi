<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#002b49">
<meta name="application-name" content="DOFİ">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="DOFİ">
<title>DOFİ | Düzeltici Faaliyet Portalı</title>
<link rel="manifest" href="./manifest.webmanifest">
<link rel="icon" type="image/png" sizes="192x192" href="./icon-192.png">
<link rel="icon" type="image/png" sizes="512x512" href="./icon-512.png">
<link rel="apple-touch-icon" href="./icon-192.png">
<style>
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#f4f6f9}
#frame{display:block;width:100%;height:100dvh;border:0;background:#f4f6f9}
#firstLoad{position:fixed;inset:0;z-index:10;display:grid;place-items:center;background:#f4f6f9;pointer-events:none;transition:opacity .18s ease,visibility .18s ease}
#firstLoad.hide{opacity:0;visibility:hidden}
.quickCard{width:min(430px,calc(100vw - 28px));height:315px;background:#fff;border:1px solid #e1e9ef;border-radius:18px;box-shadow:0 12px 38px rgba(0,43,73,.09);position:relative;overflow:hidden}
.shimmer{position:absolute;inset:0;background:linear-gradient(100deg,transparent 20%,rgba(255,255,255,.75) 45%,transparent 70%);transform:translateX(-100%);animation:sh 1s infinite}
.logoSk{height:82px;margin:22px 22px 18px;border-radius:10px;background:#e7eef4}
.line{height:16px;border-radius:8px;background:#e7eef4;margin:12px auto}.l1{width:72%}.l2{width:50%;height:11px}
.inputSk{height:54px;border-radius:10px;background:#edf2f6;margin:18px 22px 0}.btnSk{height:50px;border-radius:10px;background:#d9e5ed;margin:14px 22px 0}
@keyframes sh{to{transform:translateX(100%)}}
</style>
</head>
<body>
<div id="firstLoad">
  <div class="quickCard">
    <div class="logoSk"></div>
    <div class="line l1"></div><div class="line l2"></div>
    <div class="inputSk"></div><div class="btnSk"></div><div class="shimmer"></div>
  </div>
</div>
<iframe id="frame" title="DOFİ Düzeltici Faaliyet Portalı"
  allow="camera; microphone; clipboard-read; clipboard-write"
  referrerpolicy="strict-origin-when-cross-origin"></iframe>
<script>
const APP_URL='https://script.google.com/macros/s/AKfycbxv5I18idU7u_JheqIrwpIBUGcrNJ5C4WdsFNBDA2nkGS7-2hKDTAQMBBFVAzv91Bjz/exec';
const frame=document.getElementById('frame');
const firstLoad=document.getElementById('firstLoad');
frame.src=APP_URL+'?embedded=1';
frame.addEventListener('load',()=>setTimeout(()=>firstLoad.classList.add('hide'),60));
setTimeout(()=>firstLoad.classList.add('hide'),4500);
if('serviceWorker' in navigator){
  window.addEventListener('load',()=>{
    navigator.serviceWorker.register('./sw.js',{scope:'./'})
      .catch(err=>console.error('Service Worker kayıt hatası:',err));
  });
}
</script>
</body>
</html>
